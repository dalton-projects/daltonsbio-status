owner: dalton-projects
repo: daltonsbio-status

# Each row is something a student does. The three /api/health parts answer
# 503 when that part is down. See docs/plan/STATUS-PAGE.md in daltonsbio.com.
sites:
  - name: Website
    url: https://www.daltonsbio.com
    slug: website
  - name: Signing in
    url: https://www.daltonsbio.com/api/health?part=database
    slug: signing-in
  - name: Buying a course
    url: https://www.daltonsbio.com/api/health?part=payments
    slug: buying-a-course
  - name: Lessons
    url: https://www.daltonsbio.com/api/health?part=lessons
    slug: lessons

# Incident issues are assigned here, which is what sends the email and the
# GitHub app notification.
assignees:
  - Gabriel-Dalton

# Upptime deletes incidents that end within 15 minutes. Keep them, so a short
# outage still shows on the status page history.
skipDeleteIssues: true

# Upptime's own page is not used; status.daltonsbio.com is served from
# dalton-projects/daltonsbio-status-page, which reads this repository's results.
status-website:
  baseUrl: /daltonsbio-status
  logoUrl: https://www.daltonsbio.com/email/logo.png
  favicon: https://www.daltonsbio.com/favicon.png
  faviconSvg: https://www.daltonsbio.com/favicon.png
  name: D'Alton's Bio-Energy status
  introTitle: "Service status for D'Alton's School of Bio-Energy Healing"
  introMessage: If something is not working for you and it is not listed here, email [info@daltonsbio.com](mailto:info@daltonsbio.com).
  navbar:
    - title: Status
      href: /
    - title: Back to the school
      href: https://www.daltonsbio.com

# Replaces the default "This page is open source, powered by Upptime" line.
i18n:
  footer: "D'Alton's School of Bio-Energy Healing. Questions? Email [info@daltonsbio.com](mailto:info@daltonsbio.com)."
